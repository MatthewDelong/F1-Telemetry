name: F1 Data Auto-Update

on:
  schedule:
    # Runs at 09:15 UTC every Monday (10:15 AM BST / 9:15 AM GMT)
    # Using an odd minute (:15) prevents GitHub from delaying or dropping the job due to top-of-the-hour server overload
    - cron: '15 9 * * 1'
  
  # Allows you to trigger this manually from the Actions tab in GitHub
  workflow_dispatch: 

jobs:
  update-f1-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run F1 Update Script
        working-directory: ./backend
        # This inline script loads your updater and runs the current season update
        run: |
          node -e "
            const updater = require('./updater.js');
            const year = new Date().getFullYear();
            console.log('Running F1 update for ' + year);
            updater.runCurrentSeasonUpdate(year)
              .then(() => {
                console.log('Update complete.');
                process.exit(0);
              })
              .catch(err => {
                console.error('Update failed:', err);
                process.exit(1);
              });
          "

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests numpy

      - name: Run Python F1 API Update Script
        working-directory: ./src/config/f1
        run: python3 api_update.py

      - name: Standardize Race Names
        working-directory: ./src/config
        run: python3 update_race_names.py

      - name: Commit and Push database changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f backend/database.sqlite
          git add src/config/f1/
          git commit -m "Automated F1 data update (Database + JSON files)" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
