name: F1 Data Auto-Update

on:
  schedule:
    # Runs at 09:00 UTC every Monday (10:00 AM BST / 9:00 AM GMT)
    - cron: '0 9 * * 1'
  
  # Allows you to trigger this manually from the Actions tab in GitHub
  workflow_dispatch: 

jobs:
  update-f1-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run F1 Update Script
        working-directory: ./backend
        # This inline script loads your updater and runs the current season update
        run: |
          node -e "
            const updater = require('./updater.js');
            const year = new Date().getFullYear();
            console.log('Running F1 update for ' + year);
            updater.runCurrentSeasonUpdate(year)
              .then(() => {
                console.log('Update complete.');
                process.exit(0);
              })
              .catch(err => {
                console.error('Update failed:', err);
                process.exit(1);
              });
          "

      - name: Commit and Push database changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add backend/database.sqlite
          git commit -m "Automated F1 data update" || echo "No changes to commit"
          git push
